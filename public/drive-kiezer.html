<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kiezen uit Google Drive</title>
<!--
  De kiezer van Google Drive, in een kader in de app (CloudDriveDialog.tsx).

  Waarom een eigen pagina: de kiezer is een script van Google (apis.google.com).
  Dat in de CSP van de app zelf toestaan, maakt elke plek waar ooit HTML in de
  app terechtkomt een deur voor scripts van die host. Deze pagina toont niets
  van gebruikers; alleen hier mag dat script (public/_headers, /drive-kiezer).

  De app geeft het korte token (alleen drive.file) via postMessage; de pagina
  geeft de gekozen id's zo terug. Beide kanten kijken naar de herkomst.
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .melding { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 320px; padding: 16px 18px; border-radius: 14px; background: #fff; color: #1f2937; box-shadow: 0 12px 40px rgba(0,0,0,.25); font-size: 14px; line-height: 1.5; text-align: center; }
  .melding[hidden] { display: none; }
</style>
<script src="/drive-kiezer.js" defer></script>
</head>
<body>
<div class="melding" id="melding" role="status">Google Drive openen…</div>
</body>
</html>
