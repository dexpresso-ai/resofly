name = "resofly-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Het adres van de AI-koppeling: https://mcp.resofly.com/mcp. Stuurt door naar
# de edge functions mcp en mcp-oauth. Inrichten en controleren:
# docs/setup/MCP_CONNECTOR_SETUP.md, "Het eigen adres".
#
# Secret (via `wrangler secret put MCP_PROXY_SECRET --env staging`, NIET hier):
# moet gelijk zijn aan het Supabase-secret met dezelfde naam. Daarmee gelooft
# mcp-oauth het IP-adres dat deze Worker doorgeeft.
#
# Het adres hoort bij één omgeving tegelijk. Nu is dat staging (er is nog geen
# productie). Krijgt productie het, verplaats dan de route hieronder naar
# [env.production] en geef staging een eigen naam, bijvoorbeeld
# mcp-staging.resofly.com. Pas daarna MCP_RESOURCE_URL en MCP_PUBLIC_BASE_URL in
# beide Supabase-projecten aan, en VITE_MCP_SERVER_URL in beide Pages-builds.
# Wrangler weigert een route die al bij een andere Worker hoort.

[vars]
SUPABASE_URL = "https://YOUR_PRODUCTION_PROJECT.supabase.co"
APP_URL = "https://app.resofly.com"

# ---- staging ----
[env.staging]
name = "resofly-mcp-staging"
# Het adres op workers.dev blijft: daarmee controleer je de Worker zonder route.
workers_dev = true

[env.staging.vars]
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"
APP_URL = "https://staging.resofly.com"

# De wildcard *.resofly.com/* (de klantadressen) gaat voor alle andere namen;
# deze preciezere route gaat daar weer voor. "mcp" staat op de lijst met
# gereserveerde namen (migratie 20261108230000), dus geen klant krijgt hem.
# DNS: een eigen record mcp AAAA 100:: (proxied). Zonder dat record dekt de
# wildcard *.resofly.com het ook, maar dan hangt dit adres aan de klantadressen.
[[env.staging.routes]]
pattern = "mcp.resofly.com/*"
zone_name = "resofly.com"

# ---- production ----
[env.production]
name = "resofly-mcp"

[env.production.vars]
SUPABASE_URL = "https://YOUR_PRODUCTION_PROJECT.supabase.co"
APP_URL = "https://app.resofly.com"
