name = "resofly-media-api"
main = "src/index.ts"
compatibility_date = "2026-04-30"

[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://app.resofly.nl"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-production"
preview_bucket_name = "resofly-media-staging"

[env.staging]
name = "resofly-media-api-staging"

[env.staging.vars]
APP_ENV = "staging"
ALLOWED_ORIGINS = "https://staging.resofly.nl,https://staging.resofly.pages.dev,http://localhost:5173"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-staging"

[env.production]
name = "resofly-media-api"

[env.production.vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://app.resofly.nl"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-production"
