name = "resofly-media-api"
main = "src/index.ts"
compatibility_date = "2026-04-30"

# Secrets (via `wrangler secret put`, NIET hier): SUPABASE_SERVICE_ROLE_KEY,
# INTERNAL_UPLOAD_SECRET, MEDIA_SIGNING_SECRET (HMAC voor office-edit- en galerij-tokens),
# OFFICE_CONVERT_SECRET (docx→pdf; moet identiek zijn aan het secret op resofly-office-server).
# Optioneel: MEDIA_PUBLIC_URL (override voor de host in de WOPISrc).
# Galerij-video via Cloudflare Stream (optioneel — zonder deze vier valt video terug op R2):
# STREAM_ACCOUNT_ID, STREAM_API_TOKEN (token met Stream:Edit),
# STREAM_SIGNING_KEY_ID + STREAM_SIGNING_KEY_JWK (uit POST /stream/keys, zie GALLERY_SETUP.md).
[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://app.resofly.nl"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"
# Publieke URL van de office-server Worker (Collabora).
COLLABORA_URL = "https://resofly-office-server.gerjan.workers.dev"
# Eigen publieke URL = host in de WOPISrc die Collabora terugbelt (pin i.p.v. request-origin).
MEDIA_PUBLIC_URL = "https://resofly-media-api.gerjan.workers.dev"

# Directe interne koppeling naar de office-server: Worker→Worker-fetch via de publieke
# workers.dev-URL is op hetzelfde account geblokkeerd, dus discovery loopt via deze binding.
[[services]]
binding = "OFFICE_SERVER"
service = "resofly-office-server"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-production"
preview_bucket_name = "resofly-media-staging"

[env.staging]
name = "resofly-media-api-staging"

[env.staging.vars]
APP_ENV = "staging"
ALLOWED_ORIGINS = "https://staging.resofly.nl,https://staging.resofly.com,https://staging.resofly.pages.dev,http://localhost:5173"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"
COLLABORA_URL = "https://resofly-office-server.gerjan.workers.dev"
MEDIA_PUBLIC_URL = "https://resofly-media-api-staging.gerjan.workers.dev"

[[env.staging.services]]
binding = "OFFICE_SERVER"
service = "resofly-office-server"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-staging"

[env.production]
name = "resofly-media-api"

[env.production.vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://app.resofly.nl"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"
COLLABORA_URL = "https://resofly-office-server.gerjan.workers.dev"
MEDIA_PUBLIC_URL = "https://resofly-media-api.gerjan.workers.dev"

[[env.production.services]]
binding = "OFFICE_SERVER"
service = "resofly-office-server"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-production"
