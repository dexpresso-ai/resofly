name = "resofly-media-api"
main = "src/index.ts"
compatibility_date = "2026-04-30"

# Secrets (via `wrangler secret put`, NIET hier): SUPABASE_SERVICE_ROLE_KEY,
# INTERNAL_UPLOAD_SECRET, MEDIA_SIGNING_SECRET (HMAC voor office-edit-tokens).
# Optioneel: MEDIA_PUBLIC_URL (override voor de host in de WOPISrc).
[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://app.resofly.nl"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"
# Publieke URL van de office-server Worker (Collabora).
COLLABORA_URL = "https://resofly-office-server.gerjan.workers.dev"
# Eigen publieke URL = host in de WOPISrc die Collabora terugbelt (pin i.p.v. request-origin).
MEDIA_PUBLIC_URL = "https://resofly-media-api.gerjan.workers.dev"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-production"
preview_bucket_name = "resofly-media-staging"

[env.staging]
name = "resofly-media-api-staging"

[env.staging.vars]
APP_ENV = "staging"
ALLOWED_ORIGINS = "https://staging.resofly.nl,https://staging.resofly.com,https://staging.resofly.pages.dev,http://localhost:5173"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"
COLLABORA_URL = "https://resofly-office-server.gerjan.workers.dev"
MEDIA_PUBLIC_URL = "https://resofly-media-api-staging.gerjan.workers.dev"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-staging"

[env.production]
name = "resofly-media-api"

[env.production.vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://app.resofly.nl"
SUPABASE_URL = "https://enzghpduqwaojcxgwarr.supabase.co"
COLLABORA_URL = "https://resofly-office-server.gerjan.workers.dev"
MEDIA_PUBLIC_URL = "https://resofly-media-api.gerjan.workers.dev"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "resofly-media-production"
