# Supabase function configuration.
# calendar-integrations must be callable by Google/Microsoft during the OAuth callback.
# The function itself still requires a valid Supabase bearer token for all POST app actions.

[functions.calendar-integrations]
verify_jwt = false

# invoice-workflow must be callable by Mollie's server-to-server payment webhook,
# which carries no Supabase JWT. The webhook path is verified instead by the
# Mollie webhook secret (?secret=...), and every authenticated app action still
# enforces its own auth via requireUser() + requireOrganizationAccess() in code.
[functions.invoice-workflow]
verify_jwt = false

# client-portal serves the customer portal at /portal. Every request must come
# from a logged-in client (magic-link session), so the platform verifies the JWT
# and the function re-verifies it via requireUser(). Access to data is derived
# solely from the verified email (RPC portal_clients_for_email).
[functions.client-portal]
verify_jwt = true

# portal-login runs BEFORE the client is logged in (to provision the auth user for
# known client emails when self-signup is disabled), so it cannot require a JWT.
# It is instead guarded by an origin allowlist and only ever creates an account for
# an email that matches an existing clients.email (RPC portal_clients_for_email).
[functions.portal-login]
verify_jwt = false

# mail-inbound wordt aangeroepen door de Cloudflare Email Worker (geen Supabase
# JWT). Authenticatie gebeurt via het gedeelde MAIL_INBOUND_WEBHOOK_SECRET dat de
# functie zelf controleert (x-inbound-secret header).
[functions.mail-inbound]
verify_jwt = false

# bank-sync (GoCardless PSD2-koppeling) handelt CORS-preflight + auth zelf af, net
# als invoice-workflow: elke actie verifieert requireUser() + requireOrganizationAccess().
[functions.bank-sync]
verify_jwt = false
