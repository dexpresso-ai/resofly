# Supabase function configuration.
# calendar-integrations must be callable by Google/Microsoft during the OAuth callback.
# The function itself still requires a valid Supabase bearer token for all POST app actions.

[functions.calendar-integrations]
verify_jwt = false

# invoice-workflow must be callable by Mollie's server-to-server payment webhook,
# which carries no Supabase JWT. The webhook path is verified instead by the
# Mollie webhook secret (?secret=...), and every authenticated app action still
# enforces its own auth via requireUser() + requireOrganizationAccess() in code.
[functions.invoice-workflow]
verify_jwt = false

# client-portal serves the customer portal at /portal. Every request must come
# from a logged-in client (magic-link session), so the platform verifies the JWT
# and the function re-verifies it via requireUser(). Access to data is derived
# solely from the verified email (RPC portal_clients_for_email).
[functions.client-portal]
verify_jwt = true

# portal-login runs BEFORE the client is logged in (to provision the auth user for
# known client emails when self-signup is disabled), so it cannot require a JWT.
# It is instead guarded by an origin allowlist and only ever creates an account for
# an email that matches an existing clients.email (RPC portal_clients_for_email).
[functions.portal-login]
verify_jwt = false

# mail-inbound wordt aangeroepen door de Cloudflare Email Worker (geen Supabase
# JWT). Authenticatie gebeurt via het gedeelde MAIL_INBOUND_WEBHOOK_SECRET dat de
# functie zelf controleert (x-inbound-secret header).
[functions.mail-inbound]
verify_jwt = false

# bank-sync (GoCardless PSD2-koppeling) handelt CORS-preflight + auth zelf af, net
# als invoice-workflow: elke actie verifieert requireUser() + requireOrganizationAccess().
[functions.bank-sync]
verify_jwt = false

# gerrie-agent (Claude AI-assistent) streamt het antwoord via Server-Sent Events en
# handelt daarom CORS-preflight + auth zelf af. Elke aanvraag verifieert
# requireUser() + requireOrganizationAccess(); lees-tools draaien strikt org-scoped.
[functions.gerrie-agent]
verify_jwt = false

# gerrie-agent-runner is de headless motor voor "Gerrie Routines" (geplande agents).
# Bedient de agents-cron (?cron=tick, geauthenticeerd via AGENTS_CRON_SECRET, geen
# Supabase JWT) én ingelogde beheer-acties (create/update/status/delete/run_now via
# requireUser + requireOrganizationAccess + owner/admin in code).
[functions.gerrie-agent-runner]
verify_jwt = false

# billing wordt aangeroepen door de Mollie payment-/subscription-webhook (geen Supabase
# JWT). De webhook-route is geverifieerd via het Mollie webhook-secret (?secret=...), en
# elke authenticated app-actie verifieert zelf requireUser() + requireOrganizationAccess().
[functions.billing]
verify_jwt = false

# meeting-transcribe (opname -> ElevenLabs Scribe -> Claude-notulen) handelt CORS-preflight
# + auth zelf af: elke actie verifieert requireUser() + requireOrganizationAccess().
[functions.meeting-transcribe]
verify_jwt = false

# meeting-transcribe-webhook wordt door ElevenLabs aangeroepen wanneer een async transcriptie
# klaar is (geen Supabase JWT). Authenticatie gebeurt via de HMAC-signatuur die de functie
# zelf controleert (ElevenLabs-Signature header + ELEVENLABS_WEBHOOK_SECRET).
[functions.meeting-transcribe-webhook]
verify_jwt = false

# meeting-booking (interne beheer-API voor de boekingstool) handelt CORS + auth zelf af:
# elke actie verifieert requireUser() + requireOrganizationAccess() + schrijfrol.
[functions.meeting-booking]
verify_jwt = false

# meeting-booking-public is de klant-facing boekingspagina-API (geen login): toegang
# loopt via een onraadbaar token in de request-body, gehasht vergeleken (zoals contract-public).
[functions.meeting-booking-public]
verify_jwt = false

# campaigns bedient zowel ingelogde app-acties (requireUser + requireOrganizationAccess in
# code) als de dispatch-cron (?cron=dispatch, geauthenticeerd via het gedeelde
# CAMPAIGN_CRON_SECRET). De cron draagt geen Supabase JWT, dus verify_jwt uit.
[functions.campaigns]
verify_jwt = false

# email-unsubscribe is de publieke afmeldpagina voor marketingmail (geen login). Toegang
# loopt via een HMAC-getekend token in de URL; ondersteunt one-click POST (RFC 8058).
[functions.email-unsubscribe]
verify_jwt = false

# web-push bedient de dispatch-cron (?cron=drain, geauthenticeerd via PUSH_CRON_SECRET,
# geen Supabase JWT) én ingelogde app-acties (getVapidKey/test via requireUser in code).
[functions.web-push]
verify_jwt = false

# invoice-extract (AI-inkoopfactuurscan) handelt CORS-preflight + auth zelf af, net als
# gerrie-agent: elke aanvraag verifieert requireUser() + requireOrganizationAccess() +
# schrijfrol, plus een AI-budgetcheck vóór de betaalde Claude-call.
[functions.invoice-extract]
verify_jwt = false
