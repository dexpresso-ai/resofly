name: Frontend checks

# Typecheck, unit tests en de mobiele lay-outtest op elke pull request en op
# staging. De lay-outtest draait tegen een nagebootste backend en heeft dus
# geen Supabase-secrets nodig.
on:
  pull_request:
  push:
    branches:
      - staging
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Chromium voor Playwright
        run: npx playwright install --with-deps chromium

      - name: Mobiele lay-outtest (donker en licht)
        run: npm run test:mobile -- --theme=both
