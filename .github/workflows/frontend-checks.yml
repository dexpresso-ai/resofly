name: Frontend checks

# Typecheck, unit tests en de mobiele lay-outtest op elke pull request en op
# staging. De lay-outtest draait tegen een nagebootste backend en heeft dus
# geen Supabase-secrets nodig.
#
# Daarnaast een Deno-typecheck op de edge functions. Die draaien op Deno, niet
# op node: `npm run typecheck` ziet ze niet, en een typefout daarin komt anders
# pas aan het licht bij het uitrollen — of erger, bij de eerste aanroep door de
# AI van een klant.
#
# Deze controle dekte lang alleen de MCP-functies, omdat meeting-transcribe een
# typefout had (_shared/elevenlabs.ts, Uint8Array → Blob onder TS 6) die de hele
# job rood zette. Die is op 18 september opgelost door het parametertype te
# vernauwen naar `Uint8Array<ArrayBuffer>`, en de lijst is meteen verbreed naar
# alle functies die schoon door `deno check` komen — zie de stap hieronder.
#
# En de job `migrations`: alle migraties op een lege Supabase-database, zodat
# een nieuwe omgeving altijd met `supabase db push` op te bouwen blijft.
on:
  pull_request:
  push:
    branches:
      - staging
  workflow_dispatch: {}

# Alleen lezen: deze workflow pusht niets en schrijft niets in GitHub. Zonder
# deze regel krijgt het GITHUB_TOKEN de standaardrechten van de repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # De CSP-hash in public/_headers moet bij het inline thema-script horen;
      # anders blokkeert de browser dat script stil op Cloudflare Pages.
      - name: CSP-hash van het inline script
        run: node scripts/check-csp-hash.mjs

      - name: Unit tests
        run: npm test

      - name: Chromium voor Playwright
        run: npx playwright install --with-deps chromium

      - name: Mobiele lay-outtest (donker en licht)
        run: npm run test:mobile -- --theme=both

      # Laden per module (src/lib/dataGroups.ts): elke pagina haalt precies zijn
      # eigen groepen op, bewaart ze, ververst ze op de achtergrond, en zegt het
      # als een groep niet laadt.
      - name: Laden per module
        run: npm run test:loading

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # De lijst hieronder is alles wat schoon door `deno check` komt: 28 van de
      # 33 edge-functies, gemeten op 18 september, plus wat er sindsdien bij kwam
      # (de openbare API: api, api-admin en webhooks; de klantmeldingen:
      # portal-notify). Vijf staan er nog buiten
      # (bank-sync, client-portal, invoice-public, invoice-workflow,
      # quote-workflow); die struikelen allemaal over dezelfde TS 6-strengheid
      # waarbij een kaal `Uint8Array` generiek is over ArrayBufferLike en dus
      # niet als BodyInit of BufferSource telt. Dat is geen runtime-probleem —
      # de Edge-runtime draait die code gewoon — maar het houdt ze wel buiten
      # deze controle. Haal ze er één voor één bij zodra ze schoon zijn.
      - name: Deno-typecheck edge functions
        run: |
          deno check \
            supabase/functions/annual-accounts/index.ts \
            supabase/functions/api-admin/index.ts \
            supabase/functions/api/index.ts \
            supabase/functions/billing/index.ts \
            supabase/functions/calendar-integrations/index.ts \
            supabase/functions/campaigns/index.ts \
            supabase/functions/contract-public/index.ts \
            supabase/functions/contract-workflow/index.ts \
            supabase/functions/corporate-tax/index.ts \
            supabase/functions/email-unsubscribe/index.ts \
            supabase/functions/file-share-public/index.ts \
            supabase/functions/file-share/index.ts \
            supabase/functions/file-transfer-public/index.ts \
            supabase/functions/file-transfer/index.ts \
            supabase/functions/gallery-public/index.ts \
            supabase/functions/gerrie-agent-runner/index.ts \
            supabase/functions/gerrie-agent/index.ts \
            supabase/functions/gerrie-signals/index.ts \
            supabase/functions/invoice-extract/index.ts \
            supabase/functions/invoice-inbox/index.ts \
            supabase/functions/mail-inbound/index.ts \
            supabase/functions/mail/index.ts \
            supabase/functions/mcp-oauth/index.ts \
            supabase/functions/mcp/index.ts \
            supabase/functions/meeting-booking-public/index.ts \
            supabase/functions/meeting-booking/index.ts \
            supabase/functions/meeting-transcribe-webhook/index.ts \
            supabase/functions/meeting-transcribe/index.ts \
            supabase/functions/portal-login/index.ts \
            supabase/functions/portal-notify/index.ts \
            supabase/functions/quote-public/index.ts \
            supabase/functions/resend-webhook/index.ts \
            supabase/functions/web-push/index.ts \
            supabase/functions/webhooks/index.ts

      # De factuur-inbox: mail-inbound (ontvangst), invoice-inbox (knoppen) en
      # invoice-extract (de handmatige scan deelt de voorstel-opbouw). Geen
      # van drie raakt _shared/elevenlabs.ts, dus deze zijn veilig te checken.
      - name: Deno-typecheck factuur-inbox
        run: |
          deno check supabase/functions/mail-inbound/index.ts
          deno check supabase/functions/invoice-inbox/index.ts
          deno check supabase/functions/invoice-extract/index.ts

  # De hele migratieketen op een lege database, met de echte Supabase-images in
  # de versies uit supabase/.temp (Postgres 17.6.1.111, net als staging). Een
  # nieuwe omgeving bouw je met `supabase db push`; deze job bewijst dat dat
  # werkt. Tot november 2026 liep een lege database al bij de eerste migratie
  # stuk, omdat de basis ooit met de hand in de SQL-editor was gezet; zie
  # supabase/migrations/README.md.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dezelfde vaste versie als de deploy naar staging.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # Start alleen de database en speelt daarop alle migraties af, daarna
      # supabase/seed.sql. Eén fout in één migratie maakt de job rood.
      - name: Migraties vanaf nul op een lege database
        run: supabase db start

      # De CLI slaat een bestand met een verkeerde naam stil over ("file name
      # must match pattern"). Dan klopt de keten hier wel en op staging niet.
      - name: Elk migratiebestand is toegepast
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          files=$(ls supabase/migrations/*.sql | wc -l)
          applied=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atc "select count(*) from supabase_migrations.schema_migrations")
          echo "Migratiebestanden: $files, toegepast: $applied"
          if [ "$files" != "$applied" ]; then
            echo "::error title=Migratie overgeslagen::$files bestanden, $applied toegepast. Een migratie heet <14 cijfers>_<naam>.sql."
            exit 1
          fi
