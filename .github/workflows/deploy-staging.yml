name: Deploy Supabase (staging)

on:
  push:
    branches:
      - staging
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-staging.yml"
  # Handmatig (Actions → Deploy Supabase (staging) → Run workflow), met twee
  # vinkjes voor wat niet bij elke push hoort:
  workflow_dispatch:
    inputs:
      include_all:
        description: "Ook een oudere migratie toepassen die ooit is overgeslagen (db push --include-all)"
        type: boolean
        default: false
      setup_webhooks:
        description: "Eenmalig: de webhook-secrets zetten als ze ontbreken, en de bezorger en de opruimtaak inplannen (pg_cron)"
        type: boolean
        default: false

env:
  SUPABASE_PROJECT_ID: enzghpduqwaojcxgwarr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Vóór de CLI, want die zegt alleen "Access token not provided" — en dan sta
      # je in de Supabase-documentatie te zoeken terwijl het probleem in GitHub
      # zit. Deze stap zegt wélke secret ontbreekt en op welk scherm hij hoort.
      #
      # Let op de valkuil die ons vier deploys heeft gekost: een secret onder
      # Settings → Environments is NIET zichtbaar voor een job zonder
      # `environment:`. Hij staat er dan wel, en toch is hij hier leeg.
      - name: Controleer de secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ontbreekt=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || ontbreekt="$ontbreekt SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || ontbreekt="$ontbreekt SUPABASE_DB_PASSWORD"
          if [ -n "$ontbreekt" ]; then
            echo "::error title=Secrets ontbreken::Deze deploy kan niet draaien. Ontbreekt:$ontbreekt"
            echo ""
            echo "Zet ze hier neer:"
            echo "  Settings -> Secrets and variables -> Actions -> tabblad Secrets"
            echo "  -> New repository secret"
            echo ""
            echo "Veelgemaakte fouten:"
            echo "  * Onder Settings -> Environments gezet. Die zijn onzichtbaar voor"
            echo "    een job zonder 'environment:', en die heeft deze workflow niet."
            echo "  * Op het tabblad Variables gezet in plaats van Secrets."
            echo "  * Op organisatieniveau gezet zonder deze repository toe te laten."
            echo ""
            echo "SUPABASE_ACCESS_TOKEN maak je op https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          # De CLI wil een persoonlijk toegangstoken (sbp_…), geen API-sleutel van
          # het project (anon, service_role, sb_secret_…). Die laatste lijkt er
          # op, maar daarmee zegt de CLI alleen "Invalid access token format".
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *)
              echo "::error title=SUPABASE_ACCESS_TOKEN klopt niet::Dit is geen persoonlijk Supabase-token (dat begint met sbp_). Maak er een op https://supabase.com/dashboard/account/tokens en zet het als dit secret."
              exit 1
              ;;
          esac
          echo "Beide secrets zijn aanwezig (lengte: token ${#SUPABASE_ACCESS_TOKEN}, wachtwoord ${#SUPABASE_DB_PASSWORD})."

      # Met het wachtwoord, zodat het koppelen meteen de databaseverbinding
      # test (en niet om een wachtwoord vraagt dat er in CI niet is).
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # --yes: niet wachten op een bevestiging die in CI niemand geeft.
      # --include-all alleen met het vinkje: een overgeslagen oudere migratie
      # toepassen is een bewuste keuze (de melding noemt het bestand).
      - name: Push database migrations
        run: supabase db push --yes ${{ inputs.include_all && '--include-all' || '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # --use-api: Supabase bundelt de functies zelf, zonder Docker. Dezelfde weg
      # als SUPABASE_STAGING_LAPTOP.md, zodat CI en laptop hetzelfde doen.
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Eenmalig per omgeving, alleen met het vinkje: zie het script. Zet alleen
      # wat ontbreekt en laat geen enkele waarde in het log zien.
      - name: Webhooks inrichten (eenmalig)
        if: ${{ inputs.setup_webhooks }}
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          bash scripts/supabase-setup-webhooks.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
